<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D6B63">
  <title>Recibo simple</title>
  <style>
    :root {
      --bg: #F3F6F5;
      --card: #FFFFFF;
      --text: #1E2E2C;
      --muted: #6B7F7B;
      --line: #D5E3E0;
      --primary: #0D6B63;
      --neto: #1A4F47;
      --neto-bg: #D8EFE8;
      --warn: #9A4B12;
      --warn-bg: #FCEBDD;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 14px 32px;
    }
    h1 { font-size: 1.15rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .grid label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }
    select, input.monto {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 1rem;
      color: var(--text);
      font-family: inherit;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .item:last-child { border-bottom: 0; padding-bottom: 0; }
    .item:first-child { padding-top: 0; }
    .item label { cursor: pointer; }
    .item .name { font-size: 0.92rem; font-weight: 650; }
    .item .hint { font-size: 0.75rem; color: var(--muted); }
    .item select {
      max-width: 110px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .item input.monto {
      max-width: 140px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .neto {
      background: var(--neto-bg);
      border: 1px solid #8FCBB8;
      border-radius: 16px;
      padding: 18px 16px;
      text-align: center;
    }
    .neto span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 650;
      margin-bottom: 4px;
    }
    .neto strong {
      font-size: 1.9rem;
      color: var(--neto);
      font-variant-numeric: tabular-nums;
    }
    .aviso {
      display: none;
      margin-top: 10px;
      background: var(--warn-bg);
      color: var(--warn);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.82rem;
      text-align: center;
    }
    .aviso.show { display: block; }
    .status { margin-top: 10px; font-size: 0.78rem; color: var(--muted); text-align: center; }
    .detalle { margin-top: 10px; font-size: 0.82rem; color: var(--muted); display: none; }
    .detalle.open { display: block; }
    .detalle p { margin: 4px 0; }
    button.link {
      background: none;
      border: 0;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.95rem;
      width: 100%;
      padding: 10px 0 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Recibo de sueldo</h1>
  <p class="sub">Versión simple · los aumentos se actualizan para todos</p>

  <div class="grid">
    <div>
      <label for="mes">Mes</label>
      <select id="mes"></select>
    </div>
    <div>
      <label for="categoria">Categoría</label>
      <select id="categoria">
        <option value="13">13</option>
        <option value="16">16</option>
        <option value="18">18</option>
        <option value="19">19</option>
        <option value="20" selected>20</option>
        <option value="21">21</option>
        <option value="22">22</option>
        <option value="23">23</option>
        <option value="24">24</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="item">
      <label for="dias">
        <div class="name">Asignación de la categoría</div>
        <div class="hint">Cant. (días)</div>
      </label>
      <select id="dias"></select>
    </div>
    <div class="item">
      <label for="permPct">
        <div class="name">Permanencia</div>
        <div class="hint">Cant. (%)</div>
      </label>
      <select id="permPct"></select>
    </div>
    <div class="item">
      <label for="ant1">
        <div class="name">Antigüedad al 1%</div>
        <div class="hint">Cant. (años)</div>
      </label>
      <select id="ant1"></select>
    </div>
    <div class="item">
      <label for="ant2">
        <div class="name">Antigüedad al 2%</div>
        <div class="hint">Cant. (años)</div>
      </label>
      <select id="ant2"></select>
    </div>
    <div class="item">
      <label for="ant3">
        <div class="name">Antigüedad al 3%</div>
        <div class="hint">Cant. (años)</div>
      </label>
      <select id="ant3"></select>
    </div>
    <div class="item">
      <label for="cantFallo">
        <div class="name">Suplemento fallo de caja</div>
        <div class="hint">Cant. (independiente)</div>
      </label>
      <select id="cantFallo"></select>
    </div>
    <div class="item">
      <label for="basePers">
        <div class="name">Base Bonif. Pers. Juego</div>
        <div class="hint" id="basePersHint">Monto ($)</div>
      </label>
      <input class="monto" id="basePers" type="text" inputmode="numeric" autocomplete="off">
    </div>
  </div>

  <div class="neto">
    <span>Neto a cobrar</span>
    <strong id="neto">$ 0</strong>
  </div>
  <div class="aviso" id="aviso"></div>
  <button class="link" id="btnDetalle" type="button">Ver detalle</button>
  <div class="detalle" id="detalle"></div>
  <p class="status" id="status">Cargando datos…</p>

  <script>
    // Septiembre 26 sin aumento (= agosto). Aumento 6% en dos cuotas sobre agosto 26, no acumulativas:
    //   octubre 26   = agosto × 1,03
    //   noviembre 26 = agosto × 1,06
    const FALLBACK = {
      actualizado: "noviembre 26",
      basePersJuego: 236462,
      pctPersJuego: 0.37,
      meses: {
        "enero 26":      { cats:{13:10315,16:10902,18:11719,19:13420,20:14217,21:18857,22:24051,23:31274,24:38975}, nuevoBono:6830, bonifDecreto:570544, falloCaja:3468 },
        "febrero 26":    { cats:{13:10321,16:10908,18:11719,19:13428,20:14238,21:18878,22:24076,23:31307,24:39018}, nuevoBono:7182, bonifDecreto:571163, falloCaja:3516 },
        "marzo 26":      { cats:{13:10831,16:11447,18:12305,19:14091,20:14928,21:19800,22:25254,23:32837,24:40924}, nuevoBono:7172, bonifDecreto:599072, falloCaja:3516 },
        "abril 26":      { cats:{13:11086,16:11716,18:12594,19:14422,20:15279,21:20265,22:25847,23:33609,24:41885}, nuevoBono:7340, bonifDecreto:613140, falloCaja:5223 },
        "mayo 26":       { cats:{13:11086,16:11716,18:12594,19:14422,20:15279,21:20265,22:25847,23:33609,24:41885}, nuevoBono:7340, bonifDecreto:613140, falloCaja:5308 },
        "junio 26":      { cats:{13:11086,16:11716,18:12594,19:14422,20:15279,21:20265,22:25847,23:33609,24:41885}, nuevoBono:7340, bonifDecreto:613140, falloCaja:5308 },
        "julio 26":      { cats:{13:11640,16:12302,18:13223,19:15143,20:16043,21:21278,22:27139,23:35289,24:43980}, nuevoBono:7707, bonifDecreto:643797, falloCaja:5308 },
        "agosto 26":     { cats:{13:11861,16:12536,18:13475,19:15431,20:16348,21:21684,22:27656,23:35961,24:44817}, nuevoBono:7854, bonifDecreto:656060, falloCaja:5573 },
        "septiembre 26": { cats:{13:11861,16:12536,18:13475,19:15431,20:16348,21:21684,22:27656,23:35961,24:44817}, nuevoBono:7854, bonifDecreto:656060, falloCaja:5573 },
        "octubre 26":    { cats:{13:12217,16:12912,18:13879,19:15894,20:16838,21:22335,22:28486,23:37040,24:46162}, nuevoBono:8090, bonifDecreto:675742, falloCaja:5740 },
        "noviembre 26":  { cats:{13:12573,16:13288,18:14284,19:16357,20:17329,21:22985,22:29315,23:38119,24:47506}, nuevoBono:8325, bonifDecreto:695424, falloCaja:5907 }
      }
    };

    const LS_KEY = "reciboSimpleParams";
    const $ = id => document.getElementById(id);
    let datos = FALLBACK;
    let params = {};

    // Devuelve el entero guardado o el valor por defecto (acepta 0)
    function num(v, def) {
      const n = parseInt(v, 10);
      return Number.isFinite(n) ? n : def;
    }

    function fillRange(id, from, to, selected) {
      const sel = $(id);
      sel.innerHTML = "";
      for (let i = from; i <= to; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = i;
        if (i === selected) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    function money(n) {
      return "$ " + Math.round(n).toLocaleString("es-AR");
    }

    function parseMonto(txt) {
      const limpio = String(txt).replace(/\D/g, "");
      return limpio ? parseInt(limpio, 10) : 0;
    }

    function formatMonto(n) {
      return Math.round(n).toLocaleString("es-AR");
    }

    function loadParams() {
      try { params = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { params = {}; }
      fillRange("dias",      1, 31, num(params.dias, 24));
      fillRange("permPct",   0,  8, num(params.permPct, 3));
      fillRange("ant1",      0, 25, num(params.ant1, 5));
      fillRange("ant2",      0, 25, num(params.ant2, 1));
      fillRange("ant3",      0, 25, num(params.ant3, 20));
      fillRange("cantFallo", 0, 31, num(params.cantFallo, 24));
      if (params.categoria) $("categoria").value = params.categoria;
    }

    function saveParams() {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          dias: $("dias").value,
          permPct: $("permPct").value,
          ant1: $("ant1").value,
          ant2: $("ant2").value,
          ant3: $("ant3").value,
          cantFallo: $("cantFallo").value,
          categoria: $("categoria").value,
          mes: $("mes").value,
          basePers: parseMonto($("basePers").value)
        }));
      } catch (e) { /* sin almacenamiento disponible: se sigue calculando igual */ }
    }

    // Un mes tiene variación si algún valor cambió respecto del mes anterior
    function firma(d) {
      const cats = Object.keys(d.cats || {}).sort().map(k => k + ":" + d.cats[k]).join(",");
      return [cats, d.nuevoBono, d.bonifDecreto, d.falloCaja].join("|");
    }

    function mesesConVariacion() {
      const todos = Object.keys(datos.meses);
      return todos.filter((m, i) => i === 0 || firma(datos.meses[m]) !== firma(datos.meses[todos[i - 1]]));
    }

    function fillMeses(savedMes) {
      const sel = $("mes");
      const meses = mesesConVariacion();
      if (!meses.includes(savedMes)) savedMes = null;
      sel.innerHTML = meses.map(m => `<option value="${m}">${m}</option>`).join("");
      if (savedMes) sel.value = savedMes;
      else if (meses.includes(datos.actualizado)) sel.value = datos.actualizado;
      else sel.value = meses[meses.length - 1];
    }

    function fillBasePers() {
      const def = Number(datos.basePersJuego || 0);
      const guardado = num(params.basePers, NaN);
      $("basePers").value = formatMonto(Number.isFinite(guardado) ? guardado : def);
      $("basePersHint").textContent = "Monto ($) · por defecto " + money(def);
    }

    function mostrarAviso(txt) {
      const el = $("aviso");
      el.textContent = txt || "";
      el.classList.toggle("show", !!txt);
    }

    function calcular() {
      const mes = $("mes").value;
      const cat = $("categoria").value;
      const d = datos.meses[mes];

      if (!d) {
        $("neto").textContent = "—";
        $("detalle").innerHTML = "";
        mostrarAviso("No hay datos cargados para " + mes + ".");
        return;
      }
      const asigUnit = d.cats ? d.cats[cat] : null;
      if (asigUnit == null) {
        $("neto").textContent = "—";
        $("detalle").innerHTML = "";
        mostrarAviso("La categoría " + cat + " no tiene valor cargado para " + mes + ".");
        saveParams();
        return;
      }
      mostrarAviso("");

      const dias = parseFloat($("dias").value) || 0;
      const permPct = parseFloat($("permPct").value) || 0;
      const ant1 = parseFloat($("ant1").value) || 0;
      const ant2 = parseFloat($("ant2").value) || 0;
      const ant3 = parseFloat($("ant3").value) || 0;
      const cantFallo = parseFloat($("cantFallo").value) || 0;
      const catNum = parseInt(cat, 10);

      const basePers = parseMonto($("basePers").value);
      const pctPers = Number(datos.pctPersJuego || 0);

      const asigTotal = Math.round(asigUnit * dias);
      const respTotal = catNum >= 20 ? asigTotal : 0;
      const permanencia = Math.round(asigTotal * (permPct / 100));
      const ant1Monto = Math.round(ant1 * asigTotal * 0.01);
      const ant2Monto = Math.round(ant2 * asigTotal * 0.02);
      const ant3Monto = Math.round(ant3 * asigTotal * 0.03);
      const nuevoBonoTotal = Math.round(Number(d.nuevoBono || 0) * dias);
      const falloTotal = Math.round(Number(d.falloCaja || 0) * cantFallo);
      const bonifTotal = Math.round(Number(d.bonifDecreto || 0));
      const bonifPersJuego = Math.round(basePers * pctPers);

      const totalC = asigTotal + respTotal + permanencia + ant1Monto + ant2Monto + ant3Monto +
                     nuevoBonoTotal + bonifTotal + bonifPersJuego;
      const totalS = falloTotal;
      const totalD = Math.round(totalC * 0.14) + Math.round(totalC * 0.048) + Math.round(totalC * 0.04);
      const neto = totalC + totalS - totalD;

      $("neto").textContent = money(neto);
      $("detalle").innerHTML =
        `<p>Asignación: ${money(asigTotal)}</p>` +
        `<p>Responsabilidad jerárquica: ${money(respTotal)}</p>` +
        `<p>Permanencia: ${money(permanencia)}</p>` +
        `<p>Antigüedad 1% / 2% / 3%: ${money(ant1Monto)} / ${money(ant2Monto)} / ${money(ant3Monto)}</p>` +
        `<p>Nuevo bono: ${money(nuevoBonoTotal)}</p>` +
        `<p>Bonif. decreto: ${money(bonifTotal)}</p>` +
        `<p>Bonif. Pers. Juego (${Math.round(pctPers * 100)}% de ${money(basePers)}): ${money(bonifPersJuego)}</p>` +
        `<p>Fallo de caja: ${money(falloTotal)}</p>` +
        `<p>Haberes: ${money(totalC + totalS)} · Descuentos: ${money(totalD)}</p>`;
      saveParams();
    }

    async function init() {
      loadParams();
      try {
        const res = await fetch("datos.json?t=" + Date.now());
        if (res.ok) {
          const remoto = await res.json();
          // Los meses del servidor pisan a los locales, pero no se pierden los que falten allá
          datos = {
            ...FALLBACK,
            ...remoto,
            meses: { ...FALLBACK.meses, ...(remoto.meses || {}) }
          };
          $("status").textContent = "Datos actualizados: " + (datos.actualizado || "ok");
        } else {
          $("status").textContent = "Usando datos locales";
        }
      } catch (e) {
        $("status").textContent = "Usando datos locales";
      }
      fillMeses(params.mes);
      fillBasePers();
      calcular();
    }

    ["mes", "categoria", "dias", "permPct", "ant1", "ant2", "ant3", "cantFallo"].forEach(id => {
      $(id).addEventListener("change", calcular);
    });
    $("basePers").addEventListener("input", calcular);
    $("basePers").addEventListener("blur", () => {
      $("basePers").value = formatMonto(parseMonto($("basePers").value));
    });
    $("basePers").addEventListener("focus", e => e.target.select());
    $("btnDetalle").addEventListener("click", () => {
      const open = $("detalle").classList.toggle("open");
      $("btnDetalle").textContent = open ? "Ocultar detalle" : "Ver detalle";
    });

    init();
  </script>
</body>
</html>
